    </main>
    <script>
      (function () {
        // The reader's own store first. iPadOS reports a Mac, so Macintosh counts as Apple.
        var apple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent || '');
        var badges = document.querySelector('.badges');
        if (!apple) badges.prepend(badges.querySelector('.play'));
        // ?s=<source>&m=<medium>: Play takes one percent-encoded `referrer`, Apple a campaign token `ct`.
        var p = new URLSearchParams(location.search);
        if (p.get('s') || p.get('m')) {
          var s = (p.get('s') || 'card').slice(0, 40), m = (p.get('m') || 'qr').slice(0, 40);
          document.querySelectorAll('.play').forEach(function (a) {
            a.href = a.href.replace(/&referrer=[^&]*/, '&referrer=' + encodeURIComponent('utm_source=' + s + '&utm_medium=' + m));
          });
          document.querySelectorAll('.apple').forEach(function (a) {
            a.href = a.href.replace(/([?&])ct=[^&]*/, '$1ct=' + encodeURIComponent(s + '-' + m));
          });
        }
      })();
    </script>
